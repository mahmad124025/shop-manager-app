name: shop_manager
description: "A Professional Shop Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  path: ^1.8.3
  url_launcher: ^6.3.0
  local_auth: ^2.3.0
  pdf: ^3.11.0
  path_provider: ^2.1.4
  mobile_scanner: ^7.0.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  share_plus: ^10.0.0
  printing: ^5.13.2
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.2
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#0A1628"
  image: assets/splash_logo.png
  branding: assets/splash_branding.png
  branding_mode: bottom
  android_12:
    color: "#0A1628"
    image: assets/splash_logo.png
    branding: assets/splash_branding.png
  android: true
  ios: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"